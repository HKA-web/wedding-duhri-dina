<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        iframe {
            position: absolute;
            top: -45px; /* Menggeser iframe ke atas untuk menyembunyikan banner Google */
            left: 0;
            width: 100%;
            height: calc(100% + 45px); /* Menambah tinggi agar bawahnya tidak terpotong */
            border: none;
        }
    </style>
</head>
<body>
    <!-- Ganti link di bawah ini dengan link web apps script Anda -->
    <iframe src="https://script.google.com/macros/s/AKfycbzz7qwS09eooRYYfvfdC_I1q0bE_feiy2HoSfobW396hiVWuF-B0yXNFN6KDwwFxXs/exec"></iframe>
</body>
</html>
